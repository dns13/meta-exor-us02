# Exor uSOM02 / BeMoS, applied on top of socfpga_defconfig

# SD card (UltiMMC in the FPGA) and eMMC
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_ULTIMMC=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_PLTFM=y
CONFIG_MMC_BLOCK=y

# EMAC0 via FPGA (MII). The PHY is set up by U-Boot; use the generic PHY
# driver so that Linux does not rewrite vendor registers.
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_SOCFPGA=y
# CONFIG_RENESAS_PHY is not set

# Peripherals on the module and the carrier board
CONFIG_RTC_DRV_M41T80=y
CONFIG_EEPROM_AT24=y
CONFIG_HWMON=y
CONFIG_SENSORS_LM75=m
CONFIG_I2C_ALTERA=m
CONFIG_SPI_ALTERA=m
CONFIG_SPI_ALTERA_CORE=m
CONFIG_SERIAL_ALTERA_UART=y
CONFIG_SERIAL_ALTERA_UART_MAXPORTS=4
CONFIG_SERIAL_ALTERA_UART_BAUDRATE=115200
CONFIG_SERIAL_ALTERA_JTAGUART=y
CONFIG_GPIO_ALTERA=y
CONFIG_IIO=y
CONFIG_TI_DAC5571=m
CONFIG_MCP3422=m
CONFIG_DW_WATCHDOG=y

# systemd essentials
CONFIG_FHANDLE=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_SECCOMP=y
CONFIG_CGROUPS=y
CONFIG_IPV6=y

# Filesystems (USB drives, SMB share of the logger)
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_UTF8=y
CONFIG_CIFS=m
CONFIG_USB_STORAGE=y
