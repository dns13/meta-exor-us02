# BSP layer for the Exor uSOM02 (Intel/Altera Cyclone V SoC)
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "exor-us02"
BBFILE_PATTERN_exor-us02 := "^${LAYERDIR}/"
BBFILE_PRIORITY_exor-us02 = "9"

LAYERDEPENDS_exor-us02 = "core"
LAYERSERIES_COMPAT_exor-us02 = "blacksail"
