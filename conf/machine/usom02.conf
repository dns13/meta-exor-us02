#@TYPE: Machine
#@NAME: Exor uSOM02
#@DESCRIPTION: Exor uSOM02 module (Cyclone V SoC) on the BeMoS carrier board

require conf/machine/include/arm/armv7a/tune-cortexa9.inc
DEFAULTTUNE = "cortexa9thf-neon"

MACHINE_FEATURES = "ext2 serial usbhost vfat rtc"

SERIAL_CONSOLES = "115200;ttyS0"

# Kernel: linux-yocto 6.18 LTS + uSOM02 patches (ultimmc driver, device trees)
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.18%"
KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = " \
    intel/socfpga/socfpga_cyclone5_bemos.dtb \
    intel/socfpga/socfpga_cyclone5_bemos_v8.dtb \
"

# Bootloader: only U-Boot proper (u-boot.img) is used. The Exor preloader (SPL)
# in the eMMC stays untouched and loads u-boot.img from
#   1. SD card, partition type 0xA2, offset 256 KiB
#   2. eMMC boot0 hardware partition, offset 0
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
PREFERRED_PROVIDER_u-boot = "u-boot"
UBOOT_MACHINE = "socfpga_usom02_defconfig"
UBOOT_SUFFIX = "img"
SPL_BINARY = ""

# SD card image (installation medium). File names on the FAT partition are kept
# compatible with the existing U-Boot environment (fdtimage=socfpga.dtb or
# socfpga_bemos_v8.dtb) and the eMMC init scripts.
IMAGE_FSTYPES = "wic wic.bmap tar.gz"
WKS_FILE = "usom02-sdcard.wks"
WKS_FILE_DEPENDS = "virtual/bootloader"
IMAGE_BOOT_FILES = " \
    ${KERNEL_IMAGETYPE} \
    socfpga_cyclone5_bemos.dtb;socfpga.dtb \
    socfpga_cyclone5_bemos_v8.dtb;socfpga_bemos_v8.dtb \
"
do_image_wic[depends] += "virtual/bootloader:do_deploy"
